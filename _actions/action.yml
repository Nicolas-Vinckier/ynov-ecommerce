name: "Setup et Install"
description: "Installe Node.js et les dépendances avec cache"
inputs:
  node-version:
    description: "Version de Node à utiliser"
    required: true
    default: "20"
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install dependencies
      run: npm ci
      shell: bash
